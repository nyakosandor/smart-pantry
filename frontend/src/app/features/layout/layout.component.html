<div class="min-h-screen bg-neutral-50 flex flex-col">

  <!-- Top navbar -->
  <header class="sticky top-0 z-30 border-b border-neutral-200 bg-white shadow-sm">
    <div class="mx-auto max-w-screen-xl px-4 sm:px-6">
      <div class="flex h-16 items-center justify-between gap-4">

        <!-- Brand -->
        <div class="flex items-center gap-2.5 flex-shrink-0">
          <div class="flex h-8 w-8 items-center justify-center rounded-md bg-brand-600 text-white">
            <!-- archive-box icon -->
            <svg class="h-4.5 w-4.5" xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
            </svg>
          </div>
          <span class="text-sm font-semibold tracking-tight text-neutral-900">Smart Pantry</span>
        </div>

        <!-- Desktop navigation -->
        <nav class="hidden sm:flex items-center gap-0.5" aria-label="Main navigation">
          <a
            routerLink="/dashboard"
            routerLinkActive="nav-active"
            class="nav-link"
          >
            <!-- squares-2x2 icon -->
            <svg class="h-4 w-4 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
            </svg>
            Dashboard
          </a>

          <a
            routerLink="/shopping-list"
            routerLinkActive="nav-active"
            class="nav-link"
          >
            <!-- shopping-cart icon -->
            <svg class="h-4 w-4 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
            </svg>
            Shopping List
          </a>
        </nav>

        <!-- User info + actions -->
        <div class="flex items-center gap-2">
          @if (currentUserName()) {
            <span class="hidden sm:block text-sm text-neutral-500 font-medium">
              {{ currentUserName() }}
            </span>
          }

          <!-- Sign out -->
          <button
            type="button"
            class="btn-ghost"
            title="Sign out"
            (click)="signOut()"
          >
            <!-- arrow-right-on-rectangle icon -->
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
            </svg>
          </button>

          <!-- Mobile menu toggle -->
          <button
            type="button"
            class="btn-ghost sm:hidden"
            [attr.aria-label]="mobileMenuOpen() ? 'Close menu' : 'Open menu'"
            (click)="toggleMobileMenu()"
          >
            @if (mobileMenuOpen()) {
              <!-- x-mark icon -->
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
              </svg>
            } @else {
              <!-- bars-3 icon -->
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
              </svg>
            }
          </button>
        </div>

      </div>
    </div>

    <!-- Mobile menu panel -->
    @if (mobileMenuOpen()) {
      <div class="sm:hidden border-t border-neutral-200 bg-white px-4 py-3 space-y-1">
        @if (currentUserName()) {
          <p class="px-3 py-1 text-xs font-medium text-neutral-400 uppercase tracking-wide">
            {{ currentUserName() }}
          </p>
        }
        <a
          routerLink="/dashboard"
          routerLinkActive="nav-active"
          class="nav-link-mobile"
          (click)="closeMobileMenu()"
        >
          <svg class="h-4 w-4 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none"
               viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
          </svg>
          Dashboard
        </a>

        <a
          routerLink="/shopping-list"
          routerLinkActive="nav-active"
          class="nav-link-mobile"
          (click)="closeMobileMenu()"
        >
          <svg class="h-4 w-4 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none"
               viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
          </svg>
          Shopping List
        </a>
      </div>
    }
  </header>

  <!-- Page content -->
  <main class="flex-1">
    <router-outlet />
  </main>

  <!-- Global toast notifications -->
  <app-toast />

</div>
