<div class="card flex h-full flex-col">
  <div class="border-b border-neutral-200 px-5 py-4">
    <h3 class="text-sm font-semibold text-neutral-900">Inventory by Category</h3>
    <p class="mt-0.5 text-xs text-neutral-500">Distribution of pantry items across categories</p>
  </div>

  <div class="flex flex-1 items-center justify-center px-5 py-4">
    @if (isEmpty()) {
      <p class="text-sm text-neutral-400">No data to display. Add ingredients to see the breakdown.</p>
    } @else {
      <div class="relative h-56 w-full">
        <canvas
          baseChart
          [data]="chartData()"
          [options]="chartOptions"
          type="doughnut"
          role="img"
          aria-label="Doughnut chart showing ingredient distribution by category"
        ></canvas>
      </div>
    }
  </div>
</div>
