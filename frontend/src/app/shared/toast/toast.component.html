<!-- Toast stack — fixed bottom-right, rendered above everything -->
<div
  class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-2"
  aria-live="assertive"
  aria-atomic="false"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex max-w-sm items-start gap-3 rounded-lg border px-4 py-3.5 shadow-lg
             transition-all duration-300"
      [class]="toast.type === 'success'
        ? 'bg-success-50 border-success-100 text-success-700'
        : 'bg-danger-50 border-danger-100 text-danger-700'"
      [class.opacity-0]="toast.exiting"
      [class.translate-x-16]="toast.exiting"
      style="animation: toast-in 0.25s ease-out"
      role="alert"
    >
      <!-- Icon -->
      @if (toast.type === 'success') {
        <svg class="mt-0.5 h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd"
                d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
                clip-rule="evenodd" />
        </svg>
      } @else {
        <svg class="mt-0.5 h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd"
                d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003ZM12 8.25a.75.75 0 0 1 .75.75v3.75a.75.75 0 0 1-1.5 0V9a.75.75 0 0 1 .75-.75Zm0 8.25a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z"
                clip-rule="evenodd" />
        </svg>
      }

      <!-- Message -->
      <p class="flex-1 text-sm">{{ toast.message }}</p>

      <!-- Dismiss button -->
      <button
        class="shrink-0 opacity-60 hover:opacity-100 transition-opacity"
        [attr.aria-label]="'Dismiss notification'"
        (click)="toastService.dismiss(toast.id)"
      >
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
